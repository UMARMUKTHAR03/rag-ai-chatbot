name: OmniMind AI Production CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  backend-tests:
    name: Backend PyTest Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Server Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r server/requirements.txt
          pip install pytest pytest-asyncio

      - name: Run Backend PyTest Suite
        run: |
          cd server
          pytest tests/test_api.py -v --tb=short

      - name: Run Retrieval Benchmark
        run: |
          python evaluations/run_benchmark.py

  frontend-build-and-deploy:
    name: Frontend Vitest & GitHub Pages Deploy
    runs-on: ubuntu-latest
    needs: backend-tests
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Run Vitest Unit Tests
        working-directory: frontend
        run: npm test -- --run

      - name: Build Production Frontend
        working-directory: frontend
        run: npm run build
        env:
          VITE_API_URL: https://omnimind-ai-backend.onrender.com

      - name: Copy Dist to Root for GitHub Pages
        run: |
          cp -r frontend/dist/assets/* assets/ || true
          cp frontend/dist/index.html index.html
          cp frontend/dist/index.html 404.html

      - name: Deploy to gh-pages branch
        if: github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./frontend/dist
          keep_files: false
          force_orphan: false
