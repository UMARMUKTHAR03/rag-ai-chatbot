services:
  - type: web
    name: omnimind-ai-backend
    runtime: python
    buildCommand: pip install -r server/requirements.txt
    startCommand: python -m uvicorn server.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: PYTHONPATH
        value: server
      - key: GROQ_API_KEY
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
      - key: TEMPFILE_UPLOAD_DIRECTORY
        value: /tmp/omnimind_uploads
      - key: DATA_DIR
        value: /tmp/omnimind_data
      - key: CORS_ORIGINS
        value: "*"
    healthCheckPath: /health
