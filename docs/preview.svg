      <text x="70" y="20" text-anchor="middle" class="font-sans" font-size="11" font-weight="600" fill="#34d399">💬 Chat with PDF</text>

      <rect x="150" y="0" width="140" height="30" rx="6" fill="rgba(255, 255, 255, 0.04)"/>
      <text x="220" y="20" text-anchor="middle" class="font-sans" font-size="11" font-weight="500" fill="#94a3b8">🔬 Vector Inspector</text>

      <rect x="630" y="0" width="90" height="30" rx="6" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
      <text x="675" y="19" text-anchor="middle" class="font-sans" font-size="10" fill="#cbd5e1">📥 Export CSV</text>
    </g>

    <!-- User Question -->
    <g transform="translate(20, 68)">
      <rect x="180" y="0" width="540" height="52" rx="10" fill="#1e293b" stroke="rgba(255, 255, 255, 0.06)" stroke-width="1"/>
      <circle cx="150" cy="26" r="16" fill="#3b82f6"/>
      <text x="150" y="30" text-anchor="middle" class="font-sans" font-size="11" font-weight="bold" fill="#fff">YOU</text>
      <text x="196" y="24" class="font-sans" font-size="12" font-weight="500" fill="#f8fafc">What are the primary alignment strategies outlined in Section 3?</text>
      <text x="196" y="42" class="font-sans" font-size="10" fill="#64748b">Target Document: AI_Safety_Report.pdf • Vectorized in 2.8ms</text>
    </g>

    <!-- Retrieval Pill -->
    <g transform="translate(196, 134)">
      <rect width="380" height="24" rx="12" fill="rgba(16, 185, 129, 0.15)" stroke="#10b981" stroke-width="1"/>
      <circle cx="16" cy="12" r="3.5" fill="#10b981"/>
      <text x="26" y="16" class="font-sans" font-size="11" font-weight="600" fill="#34d399">Retrieved 3 chunks from AI_Safety_Report.pdf (Sim: 0.942)</text>
    </g>

    <!-- AI Grounded Response -->
    <g transform="translate(20, 172)">
      <rect x="48" y="0" width="672" height="180" rx="12" fill="rgba(15, 23, 42, 0.9)" stroke="rgba(16, 185, 129, 0.3)" stroke-width="1"/>
      <circle cx="24" cy="26" r="16" fill="url(#primaryGrad)"/>
      <text x="24" y="30" text-anchor="middle" class="font-sans" font-size="11" font-weight="bold" fill="#04121a">AI</text>
      
      <text x="68" y="28" class="font-sans" font-size="12" font-weight="600" fill="#f1f5f9">According to Section 3 (Alignment Protocols) of the uploaded PDF:</text>
      <text x="68" y="54" class="font-sans" font-size="12" fill="#cbd5e1">1. The framework implements Direct Preference Optimization (DPO) to align outputs <tspan fill="#34d399" font-weight="bold">[Page 4]</tspan>.</text>
      <text x="68" y="78" class="font-sans" font-size="12" fill="#cbd5e1">2. Rule-based reward penalties are enforced to suppress hallucinations and deceptive behavior <tspan fill="#34d399" font-weight="bold">[Page 5]</tspan>.</text>
      <text x="68" y="102" class="font-sans" font-size="12" fill="#cbd5e1">3. Automated red-teaming benchmarks test prompt injection defenses across 120 categories <tspan fill="#34d399" font-weight="bold">[Page 11]</tspan>.</text>
      <text x="68" y="126" class="font-sans" font-size="12" fill="#cbd5e1">4. Groundedness validation score: 89.4% truthfulness against human baselines.</text>

      <line x1="68" y1="144" x2="700" y2="144" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
      <text x="68" y="164" class="font-sans" font-size="10" fill="#94a3b8">Model: Llama-3-70b-Groq • Retrieved via Cosine Sim: 0.942 • Search: 11.4ms • Grounded: 99.2%</text>
    </g>

    <!-- Input Bar -->
    <g transform="translate(20, 368)">
      <rect width="720" height="52" rx="10" fill="rgba(15, 23, 42, 0.9)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1"/>
      <text x="20" y="31" class="font-sans" font-size="12" fill="#64748b">Ask anything about the uploaded PDF document...</text>
      <rect x="660" y="8" width="50" height="36" rx="8" fill="#10b981"/>
      <path d="M 680 26 L 690 26 M 686 22 L 690 26 L 686 30" fill="none" stroke="#050811" stroke-width="2.5" stroke-linecap="round"/>
    </g>
  </g>

  <!-- Watermark Footer -->
  <text x="600" y="664" text-anchor="middle" class="font-sans" font-size="12" font-weight="500" fill="#64748b">RAG AI Chatbot • Designed, Engineered &amp; Maintained by UMAR MUKTHAR • All Rights Reserved</text>
</svg>
