<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b14"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(30, 41, 59, 0.75)"/>
      <stop offset="100%" stop-color="rgba(15, 23, 42, 0.85)"/>
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <style>
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .title { font-weight: 800; fill: #ffffff; }
    .subtitle { font-weight: 500; fill: #94a3b8; }
    .card-title { font-size: 13px; font-weight: 600; fill: #94a3b8; text-transform: uppercase; letter-spacing: 0.8px; }
    .metric-value { font-size: 26px; font-weight: 700; fill: #f8fafc; }
    .metric-sub { font-size: 12px; font-weight: 500; }
  </style>
  <rect width="1200" height="680" fill="url(#bgGrad)"/>
  <circle cx="200" cy="150" r="160" fill="#10b981" opacity="0.12" filter="url(#glow)"/>
  <circle cx="1020" cy="200" r="180" fill="#8b5cf6" opacity="0.12" filter="url(#glow)"/>
  <circle cx="600" cy="560" r="220" fill="#06b6d4" opacity="0.08" filter="url(#glow)"/>

  <!-- Top Bar -->
  <rect x="30" y="24" width="1140" height="64" rx="14" fill="url(#cardGrad)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1"/>
  <rect x="50" y="40" width="32" height="32" rx="8" fill="url(#primaryGrad)"/>
  <text x="66" y="62" text-anchor="middle" font-size="20">🤖</text>
  <text x="94" y="55" class="font-sans title" font-size="19">RAG AI Chatbot — Document Knowledge Engine</text>
  <text x="94" y="70" class="font-sans subtitle" font-size="11">Upload PDF Documents &amp; Chat Grounded in Facts • FastAPI · Streamlit · ChromaDB · LangChain</text>
  
  <rect x="800" y="42" width="170" height="28" rx="14" fill="rgba(16, 185, 129, 0.15)" stroke="#10b981" stroke-width="1"/>
  <circle cx="816" cy="56" r="4" fill="#10b981"/>
  <text x="828" y="60" class="font-sans" font-size="12" font-weight="600" fill="#34d399">CHROMADB + LLAMA-3</text>

  <rect x="985" y="42" width="170" height="28" rx="14" fill="rgba(139, 92, 246, 0.2)" stroke="#8b5cf6" stroke-width="1"/>
  <circle cx="1001" cy="56" r="4" fill="#a78bfa"/>
  <text x="1013" y="60" class="font-sans" font-size="12" font-weight="600" fill="#ddd6fe">BY UMAR MUKTHAR</text>

  <!-- 4 Metrics KPI -->
  <g transform="translate(30, 104)">
    <rect width="268" height="88" rx="12" fill="url(#cardGrad)" stroke="rgba(255, 255, 255, 0.06)" stroke-width="1"/>
    <text x="20" y="30" class="font-sans card-title">PDF Ingestion Speed</text>
    <text x="20" y="60" class="font-sans metric-value" fill="#34d399">1.8 sec</text>
    <text x="20" y="78" class="font-sans metric-sub" fill="#34d399">Fast Token Chunking Engine</text>
  </g>
  <g transform="translate(321, 104)">
    <rect width="268" height="88" rx="12" fill="url(#cardGrad)" stroke="rgba(255, 255, 255, 0.06)" stroke-width="1"/>
    <text x="20" y="30" class="font-sans card-title">Vector Search Latency</text>
    <text x="20" y="60" class="font-sans metric-value">12.4 ms</text>
    <text x="20" y="78" class="font-sans metric-sub" fill="#22d3ee">ChromaDB HNSW Cosine Index</text>
  </g>
  <g transform="translate(612, 104)">
    <rect width="268" height="88" rx="12" fill="url(#cardGrad)" stroke="rgba(255, 255, 255, 0.06)" stroke-width="1"/>
    <text x="20" y="30" class="font-sans card-title">Factual Grounding</text>
    <text x="20" y="60" class="font-sans metric-value">99.2%</text>
    <text x="20" y="78" class="font-sans metric-sub" fill="#a78bfa">Strict Page &amp; Section Citations</text>
  </g>
  <g transform="translate(902, 104)">
    <rect width="268" height="88" rx="12" fill="url(#cardGrad)" stroke="rgba(255, 255, 255, 0.06)" stroke-width="1"/>
    <text x="20" y="30" class="font-sans card-title">Multi-Provider Support</text>
    <text x="20" y="60" class="font-sans metric-value" fill="#38bdf8">Groq + Gemini</text>
    <text x="20" y="78" class="font-sans metric-sub" fill="#38bdf8">Llama-3-70b &amp; Gemini-1.5</text>
  </g>

  <!-- Left Card: Upload Zone & Document Selector -->
  <g transform="translate(30, 210)">
    <rect width="360" height="436" rx="14" fill="url(#cardGrad)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1"/>
    <text x="20" y="34" class="font-sans" font-size="15" font-weight="700" fill="#ffffff">PDF Document Upload</text>
    <text x="20" y="52" class="font-sans" font-size="11" fill="#94a3b8">Drag &amp; drop or choose from indexed samples</text>

