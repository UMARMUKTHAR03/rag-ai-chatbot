      <text x="16" y="40" class="font-sans" font-size="10" fill="#94a3b8">14 Pages • 32 Chunks • ChromaDB Ready</text>
      <rect x="256" y="16" width="50" height="20" rx="4" fill="rgba(16, 185, 129, 0.25)"/>
      <text x="281" y="30" text-anchor="middle" class="font-sans" font-size="9" font-weight="700" fill="#34d399">ACTIVE</text>
    </g>

    <!-- Presets -->
    <text x="20" y="284" class="font-sans card-title">Instant Sample Documents</text>
    
    <g transform="translate(20, 296)">
      <rect width="320" height="36" rx="6" fill="#1e293b" stroke="rgba(255, 255, 255, 0.06)" stroke-width="1"/>
      <text x="14" y="23" class="font-sans" font-size="11" fill="#f8fafc">📊 Cloud_SLA_Pricing.pdf</text>
      <text x="306" y="23" text-anchor="end" class="font-sans" font-size="10" fill="#64748b">8 pgs</text>
