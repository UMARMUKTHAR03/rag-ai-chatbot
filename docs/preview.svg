    <g transform="translate(20, 68)">
      <rect width="320" height="120" rx="10" fill="rgba(16, 185, 129, 0.05)" stroke="#10b981" stroke-dasharray="4 4" stroke-width="1.5"/>
      <text x="160" y="52" text-anchor="middle" font-size="32">📄</text>
      <text x="160" y="80" text-anchor="middle" class="font-sans" font-size="13" font-weight="700" fill="#f8fafc">Click or Drag &amp; Drop PDF</text>
      <text x="160" y="98" text-anchor="middle" class="font-sans" font-size="10" fill="#94a3b8">Upload any .pdf or .txt file to chunk &amp; chat</text>
    </g>

