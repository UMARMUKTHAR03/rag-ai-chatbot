      <text x="306" y="23" text-anchor="end" class="font-sans" font-size="10" fill="#64748b">11 pgs</text>
    </g>

    <!-- Controls -->
    <g transform="translate(20, 390)">
      <rect width="320" height="34" rx="6" fill="rgba(255, 255, 255, 0.04)" stroke="rgba(255, 255, 255, 0.06)" stroke-width="1"/>
      <text x="14" y="22" class="font-sans" font-size="11" fill="#94a3b8">Model: <tspan fill="#34d399" font-weight="600">Llama-3-70b (Groq LPU)</tspan></text>
      <text x="306" y="22" text-anchor="end" class="font-sans" font-size="11" fill="#22d3ee">Top-K: 3</text>
    </g>
  </g>

  <!-- Right Card: Interactive Q&A Chat & Citations -->
  <g transform="translate(410, 210)">
    <rect width="760" height="436" rx="14" fill="url(#cardGrad)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1"/>
    
    <!-- Tab Bar -->
